name: Diagnose keystore secret

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "length: ${#MH_UPLOAD_STORE_FILE}"
          echo "first 30: ${MH_UPLOAD_STORE_FILE:0:30}"
          echo "last 10: ${MH_UPLOAD_STORE_FILE: -10}"
          printf '%s' "$MH_UPLOAD_STORE_FILE" | base64 -d > /tmp/k.jks && echo "DECODE OK $(wc -c < /tmp/k.jks)" || echo "DECODE FAIL"
        env:
          MH_UPLOAD_STORE_FILE: ${{ secrets.MH_UPLOAD_STORE_FILE }}
