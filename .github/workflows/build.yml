name: Build and test

on:
  push:
    branches: [ main ]
    # Docs- and metadata-only pushes must not trigger a build: every main
    # build publishes a Release and bumps versionCode (commit count), so a
    # README or store-graphic change would otherwise push a byte-identical
    # "update" to every user's in-app updater. If any code path changes this
    # filter is bypassed and the build runs as normal.
    paths-ignore:
      - 'README.md'
      - 'PRIVACY.md'
      - 'LICENSE'
      - '**/*.md'
      - 'docs/**'
      - 'assets/**'
      - 'fastlane/**'
      - '.github/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # Needed to publish the GitHub Release that the in-app updater reads.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone: the versionCode below
          # is the commit count, so a depth-1 checkout would always yield 1
          # and Android would never see a new build as an update.
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-\${{ runner.os }}-\${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-\${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Decode release signing keystore
        # The keystore is stored as a base64 repository secret so CI can sign
        # builds with the same key every run. A permanent signing key is what
        # lets a new APK *update* an installed one instead of failing with an
        # INSTALL_PARSE_FAILED_INCONSISTENT_SIGNATURES error. tr strips any
        # stray whitespace/newlines the secret value may carry.
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$MH_UPLOAD_STORE_FILE" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/keystore/agentic-release.jks"
          ls -la "$RUNNER_TEMP/keystore/agentic-release.jks"
        env:
          MH_UPLOAD_STORE_FILE: ${{ secrets.MH_UPLOAD_STORE_FILE }}

      - name: Compute next version code
        # versionCode must increase for every release, otherwise Android treats
        # the APK as already installed ("app not updated"). Counts commits on
        # the pushed commit so every merge/push bumps the number.
        id: version
        run: echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build release APK (online, signed)
        run: ./gradlew :app:assembleOnlineRelease --no-daemon --stacktrace -PappVersionCode=${{ steps.version.outputs.code }} -PappVersionName=2.0.0
        env:
          MH_UPLOAD_STORE_FILE: ${{ runner.temp }}/keystore/agentic-release.jks
          MH_UPLOAD_STORE_PASSWORD: ${{ secrets.MH_UPLOAD_STORE_PASSWORD }}
          MH_UPLOAD_KEY_ALIAS: ${{ secrets.MH_UPLOAD_KEY_ALIAS }}
          MH_UPLOAD_KEY_PASSWORD: ${{ secrets.MH_UPLOAD_KEY_PASSWORD }}

      - name: Run unit tests
        run: ./gradlew :app:testOnlineDebugUnitTest --no-daemon

      - name: Rename APK with version
        run: |
          mkdir -p release-out
          cp app/build/outputs/apk/online/release/*.apk "release-out/agentic-online-release-v${{ steps.version.outputs.code }}.apk"
          ls -la release-out

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentic-online-release
          path: release-out/*.apk
          if-no-files-found: error

      - name: Publish release for the in-app updater
        # The app's APP_UPDATE_MANIFEST_URL points at
        # releases/latest/download/agentic-update.json on this repo. Without a
        # published Release carrying that manifest the updater has nothing to
        # fetch, so publish it here on every main build.
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail
          APK="release-out/agentic-online-release-v${{ steps.version.outputs.code }}.apk"
          SHA="$(sha256sum "$APK" | cut -d' ' -f1)"
          SIZE="$(stat -c%s "$APK")"
          cat > agentic-update.json <<EOF
          {
            "versionCode": ${{ steps.version.outputs.code }},
            "versionName": "2.0.0",
            "notes": "Latest Agentic build.",
            "artifacts": {
              "online": {
                "url": "https://github.com/elias-veyne/AGENTIC/releases/latest/download/agentic-online-release-v${{ steps.version.outputs.code }}.apk",
                "sha256": "$SHA",
                "sizeBytes": $SIZE
              }
            }
          }
          EOF
          # Recreate the rolling "latest" release so updates always point forward.
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            --title "Agentic ${{ steps.version.outputs.code }}" \
            --notes "Signed online release build (versionCode ${{ steps.version.outputs.code }})." \
            --latest \
            "$APK" agentic-update.json
        env:
          GH_TOKEN: ${{ github.token }}
