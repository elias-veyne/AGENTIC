name: Diag secret

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        env:
          S: ${{ secrets.MH_UPLOAD_STORE_FILE }}
        run: |
          echo "len=${#S}"
          printf '%s' "$S" | tr -d '[:space:]' | base64 -d > /tmp/k.jks && echo "DECODE_OK size=$(wc -c < /tmp/k.jks)" || echo "DECODE_FAIL rc=$?"
          printf '%s' "$S" | tr -d '[:space:]' > /tmp/s.txt
          echo "stripped_len=$(wc -c < /tmp/s.txt)"
          echo "mod4=$(( $(wc -c < /tmp/s.txt) % 4 ))"
